<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PKM Knowledge Graph</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7.8.5/dist/d3.min.js"></script>
  <style>
    :root {
      --bg: #0e1116;
      --panel: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --accent: #58a6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      overflow: hidden;
    }
    #toolbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 56px;
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 16px;
      z-index: 10;
    }
    #toolbar h1 {
      font-size: 16px;
      margin: 0 12px 0 0;
      font-weight: 600;
    }
    #toolbar label { color: var(--muted); font-size: 13px; }
    #toolbar select, #toolbar input, #toolbar button {
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
    }
    #toolbar button {
      background: var(--accent);
      color: #0e1116;
      cursor: pointer;
      font-weight: 600;
      border: none;
    }
    #toolbar button:hover { filter: brightness(1.1); }
    #stats { color: var(--muted); margin-left: auto; font-size: 12px; font-family: ui-monospace, monospace; }
    #graph { width: 100vw; height: calc(100vh - 56px); margin-top: 56px; }
    #detail {
      position: fixed;
      bottom: 16px;
      right: 16px;
      width: 320px;
      max-height: 50vh;
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      font-size: 13px;
      display: none;
    }
    #detail h3 { margin: 0 0 8px 0; font-size: 14px; color: var(--accent); }
    #detail .row { margin: 4px 0; color: var(--muted); }
    #detail .row span { color: var(--text); }
    .tag-chip {
      display: inline-block;
      padding: 2px 8px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border-radius: 999px;
      font-size: 11px;
      margin: 2px 2px 2px 0;
    }
    .node-label {
      pointer-events: none;
      font-size: 11px;
      fill: var(--text);
      font-family: -apple-system, sans-serif;
    }
    .link { stroke-opacity: 0.4; }
    .link.tag { stroke: #58a6ff; }
    .link.wikilink { stroke: #f0883e; }
    .link.similarity { stroke: #3fb950; }
    .legend {
      position: fixed;
      top: 72px;
      right: 16px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px;
      color: var(--muted);
    }
    .legend .dot {
      display: inline-block;
      width: 10px; height: 2px;
      vertical-align: middle;
      margin-right: 6px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <h1>🧠 PKM Knowledge Graph</h1>
    <label>Scope</label>
    <select id="scope">
      <option value="all">All</option>
      <option value="recent">Recent</option>
      <option value="tag">By tag</option>
    </select>
    <label>Limit</label>
    <input id="limit" type="number" min="10" max="1000" value="200" style="width:80px" />
    <label>Tag</label>
    <input id="tag" type="text" placeholder="(only when scope=tag)" style="width:160px" />
    <label><input id="sim" type="checkbox" /> similarity</label>
    <button id="reload">Reload</button>
    <span id="stats">no data</span>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:#58a6ff"></span>shared tag</div>
    <div><span class="dot" style="background:#f0883e"></span>wikilink</div>
    <div><span class="dot" style="background:#3fb950"></span>similarity</div>
  </div>

  <svg id="graph"></svg>
  <div id="detail"></div>

<script>
const svg = d3.select("#graph");
const width = window.innerWidth;
const height = window.innerHeight - 56;
const g = svg.append("g");

svg.call(
  d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => g.attr("transform", e.transform))
);

const colorScale = d3.scaleOrdinal(d3.schemeTableau10);

async function loadGraph() {
  const scope = document.getElementById("scope").value;
  const limit = document.getElementById("limit").value;
  const tag = document.getElementById("tag").value;
  const sim = document.getElementById("sim").checked;
  const params = new URLSearchParams({ scope, limit, include_similarity: sim });
  if (tag) params.set("tag", tag);
  const r = await fetch(`/api/graph?${params}`);
  if (!r.ok) {
    document.getElementById("stats").textContent = `error ${r.status}`;
    return;
  }
  const data = await r.json();
  render(data);
}

function render(data) {
  g.selectAll("*").remove();
  const { nodes, edges, stats } = data;
  document.getElementById("stats").textContent =
    `${stats.node_count} nodes · ${stats.edge_count} edges ` +
    `(tag=${stats.tag_edges}, link=${stats.wikilink_edges}, sim=${stats.similarity_edges})`;

  if (!nodes.length) {
    g.append("text")
      .attr("x", width / 2).attr("y", height / 2)
      .attr("text-anchor", "middle").attr("fill", "#8b949e")
      .text("No knowledge ingested yet — try `python main.py ingest web <url>`");
    return;
  }

  const links = edges.map((e) => ({ ...e }));
  const sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((d) => 60 + 40 / (d.weight || 1)))
    .force("charge", d3.forceManyBody().strength(-120))
    .force("center", d3.forceCenter(width / 2, height / 2))
    .force("collide", d3.forceCollide().radius((d) => 6 + Math.sqrt(d.weight) * 3));

  const link = g.append("g").attr("stroke-width", 1)
    .selectAll("line").data(links).join("line")
    .attr("class", (d) => `link ${d.edge_type}`)
    .attr("stroke-width", (d) => Math.max(0.5, Math.min(3, d.weight)));

  const node = g.append("g").attr("stroke", "#0e1116").attr("stroke-width", 1.5)
    .selectAll("circle").data(nodes).join("circle")
    .attr("r", (d) => 5 + Math.sqrt(d.weight) * 2)
    .attr("fill", (d) => colorScale(d.source_type))
    .style("cursor", "pointer")
    .on("click", (_, d) => showDetail(d))
    .call(drag(sim));

  const label = g.append("g").selectAll("text").data(nodes).join("text")
    .attr("class", "node-label")
    .attr("dx", 10).attr("dy", 4)
    .text((d) => d.title.length > 30 ? d.title.slice(0, 30) + "…" : d.title);

  sim.on("tick", () => {
    link
      .attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
      .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
    node.attr("cx", (d) => d.x).attr("cy", (d) => d.y);
    label.attr("x", (d) => d.x).attr("y", (d) => d.y);
  });
}

function drag(sim) {
  return d3.drag()
    .on("start", (e, d) => {
      if (!e.active) sim.alphaTarget(0.3).restart();
      d.fx = d.x; d.fy = d.y;
    })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => {
      if (!e.active) sim.alphaTarget(0);
      d.fx = null; d.fy = null;
    });
}

function showDetail(d) {
  const panel = document.getElementById("detail");
  panel.style.display = "block";
  const tagsHTML = (d.tags || []).map((t) => `<span class="tag-chip">${t}</span>`).join("");
  panel.innerHTML = `
    <h3>${d.title}</h3>
    <div class="row">id: <span>${d.id}</span></div>
    <div class="row">source: <span>${d.source_type}</span></div>
    <div class="row">degree: <span>${d.weight}</span></div>
    <div class="row">tags: <div>${tagsHTML || '<span>none</span>'}</div></div>
  `;
}

document.getElementById("reload").addEventListener("click", loadGraph);
loadGraph();
</script>
</body>
</html>
