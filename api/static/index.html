<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PKM Agent · 个人知识管理</title>
    <style>
        :root { --bg:#0f1115; --fg:#e8eaed; --muted:#8a8f98; --acc:#7c5cff; --ok:#22c55e; --card:#161922; --line:#262a35; }
        *{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Roboto,sans-serif;background:var(--bg);color:var(--fg);}
        header{padding:24px 36px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
        header h1{margin:0;font-size:20px;letter-spacing:.5px;}
        header h1 span{color:var(--acc);}
        main{padding:32px 36px;max-width:1100px;margin:0 auto;display:grid;gap:24px;}
        .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:22px;}
        .card h2{margin:0 0 14px;font-size:16px;color:#cdd1da;letter-spacing:.4px;}
        textarea, input, select { width:100%;background:#0c0e14;border:1px solid var(--line);border-radius:10px;color:var(--fg);padding:10px 12px;font-family:inherit;font-size:14px;outline:none;}
        textarea{min-height:90px;resize:vertical;}
        .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
        .row > *{flex:1;}
        button{background:var(--acc);color:white;border:0;padding:10px 18px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;transition:.15s;}
        button:hover{filter:brightness(1.1);}
        button.ghost{background:transparent;border:1px solid var(--line);color:var(--fg);}
        .pill{display:inline-block;background:#22253310;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:12px;color:var(--muted);margin-right:6px;}
        .hits{display:grid;gap:10px;}
        .hit{padding:14px;background:#0d1018;border:1px solid var(--line);border-radius:10px;}
        .hit h4{margin:0 0 6px;font-size:14px;color:#fff;}
        .hit p{margin:6px 0;color:var(--muted);font-size:13px;line-height:1.5;}
        .chat{display:flex;flex-direction:column;gap:10px;max-height:520px;overflow-y:auto;padding:8px;}
        .msg{padding:12px 14px;border-radius:14px;max-width:80%;line-height:1.5;font-size:14px;white-space:pre-wrap;}
        .msg.user{align-self:flex-end;background:var(--acc);color:#fff;}
        .msg.assistant{align-self:flex-start;background:#0d1018;border:1px solid var(--line);}
        .meta{font-size:12px;color:var(--muted);margin-top:6px;}
        details summary{cursor:pointer;color:var(--muted);font-size:13px;}
        footer{padding:24px 36px;color:var(--muted);font-size:12px;text-align:center;}
    </style>
</head>
<body>
    <header>
        <h1>📚 PKM <span>Agent</span></h1>
        <span class="pill">v1.0 · LangGraph · Chroma · Obsidian</span>
    </header>

    <main>
        <section class="card">
            <h2>🌐 抓取 / 摄入 (Ingest)</h2>
            <div class="row">
                <select id="srcType">
                    <option value="web">网页 (Web)</option>
                    <option value="pdf">PDF</option>
                    <option value="youtube">YouTube</option>
                    <option value="wechat">微信公众号</option>
                    <option value="rss">RSS</option>
                    <option value="notion">Notion 页面</option>
                </select>
                <input id="ingestTarget" placeholder="URL 或文件路径，例如 https://..." />
                <button onclick="doIngest()">抓取并摘要</button>
            </div>
            <div id="ingestOut" class="meta"></div>
        </section>

        <section class="card">
            <h2>🔍 知识搜索 (Hybrid Vector + Keyword)</h2>
            <div class="row">
                <input id="searchQuery" placeholder="输入关键词 / 自然语言查询" />
                <button onclick="doSearch()">搜索</button>
            </div>
            <div id="searchOut" class="hits"></div>
        </section>

        <section class="card">
            <h2>💬 与知识库对话</h2>
            <div id="chatBox" class="chat"></div>
            <div class="row">
                <textarea id="chatInput" placeholder="例如：帮我总结昨天看的论文"></textarea>
            </div>
            <div class="row">
                <button onclick="doChat()">发送</button>
                <button class="ghost" onclick="resetChat()">清空对话</button>
            </div>
        </section>

        <section class="card">
            <h2>📅 每周/每月回顾</h2>
            <div class="row">
                <select id="reviewPeriod">
                    <option value="weekly">本周回顾</option>
                    <option value="monthly">本月回顾</option>
                </select>
                <button onclick="doReview()">立即生成</button>
            </div>
            <div id="reviewOut" class="meta"></div>
        </section>
    </main>

    <footer>Personal Knowledge Management Agent · Powered by LangChain / LangGraph / Chroma</footer>

<script>
const API = location.origin;
let history = [];

async function api(path, body){
    const res = await fetch(API + path, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)});
    if (!res.ok) throw new Error(await res.text());
    return await res.json();
}

async function doIngest(){
    const srcType = document.getElementById('srcType').value;
    const target = document.getElementById('ingestTarget').value.trim();
    const out = document.getElementById('ingestOut');
    if (!target) return out.textContent='请填写目标 URL/路径';
    out.textContent = '⏳ 抓取中…';
    try{
        const isUrl = /^https?:/.test(target);
        const data = await api('/api/ingest', {
            source_type: srcType,
            url: isUrl ? target : null,
            file_path: isUrl ? null : target,
            extra: {},
            auto_save_obsidian: true
        });
        out.innerHTML = `✅ 已收录 <b>${data.title}</b><br/>📂 Obsidian: ${data.obsidian_path}<br/>🏷️ 标签: ${(data.tags||[]).join(', ')}<br/>🔗 关联: ${(data.links||[]).join(', ')}`;
    }catch(e){ out.textContent = '❌ ' + e.message; }
}

async function doSearch(){
    const q = document.getElementById('searchQuery').value.trim();
    if(!q) return;
    const out = document.getElementById('searchOut');
    out.innerHTML = '⏳ 检索中…';
    const data = await api('/api/search', {query:q, k:8});
    out.innerHTML = (data.hits||[]).map(h => `
        <div class="hit"><h4>${h.title} <span class="pill">${(h.score*100).toFixed(0)}%</span></h4>
        <p>${h.snippet}</p><div class="meta">来源: ${h.source||'-'}</div></div>
    `).join('') || '<div class="meta">无结果</div>';
}

function appendChat(role, text){
    const box = document.getElementById('chatBox');
    const div = document.createElement('div');
    div.className = 'msg ' + role;
    div.textContent = text;
    box.appendChild(div); box.scrollTop = box.scrollHeight;
}

async function doChat(){
    const inp = document.getElementById('chatInput');
    const text = inp.value.trim(); if(!text) return;
    appendChat('user', text); inp.value='';
    try{
        const data = await api('/api/chat', {message:text, history, use_memory:true, top_k:6});
        history = data.history;
        appendChat('assistant', data.answer);
    }catch(e){ appendChat('assistant', '❌ ' + e.message); }
}

function resetChat(){ history = []; document.getElementById('chatBox').innerHTML=''; }

async function doReview(){
    const out = document.getElementById('reviewOut');
    out.textContent = '⏳ 生成中（可能需要几十秒）…';
    const period = document.getElementById('reviewPeriod').value;
    try{
        const data = await api('/api/review', {period});
        out.innerHTML = `✅ ${period} 回顾已生成<br/>📂 ${data.obsidian_path}<br/>📊 包含 ${data.knowledge_count} 条知识`;
    }catch(e){ out.textContent = '❌ ' + e.message; }
}
</script>
</body>
</html>
