[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pkm-agent"
version = "1.0.0"
description = "AI-powered personal knowledge management agent (LangGraph + Chroma + Obsidian)"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "PKM Agent Maintainers" }]
license = { text = "MIT" }
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
where = ["."]
include = ["agents*", "tools*", "workflows*", "api*", "models*", "scrapers*", "core*", "utils*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "A", "RUF"]
ignore = ["E501"]
